packages:
  - "apps/*"
  - "packages/*"

allowBuilds:
  esbuild: true
  "@node-rs/argon2": true
  "@prisma/client": true
  "@prisma/engines": true
  prisma: true
  unrs-resolver: true

onlyBuiltDependencies:
  - esbuild
  - "@node-rs/argon2"
  - "@prisma/client"
  - "@prisma/engines"
  - prisma
  - unrs-resolver
