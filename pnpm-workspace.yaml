packages:
  - "apps/*"
  - "packages/*"

# Native dependencies whose install/postinstall scripts are allowed to run.
# pnpm 11 refuses to run them (ERR_PNPM_IGNORED_BUILDS — a hard error in CI)
# unless approved here. This is the map `pnpm approve-builds` maintains.
allowBuilds:
  "@node-rs/argon2": true
  "@prisma/client": true
  "@prisma/engines": true
  esbuild: true
  prisma: true
  unrs-resolver: true
